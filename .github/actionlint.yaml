---
# actionlint 1.7.12, the latest release, predates GitHub's ubuntu-26.04
# image and rejects the label as unknown. Declaring it here is actionlint's
# documented way to accept a label it doesn't know. Both the pre-commit hook
# and the shared terraform-ci actionlint job read this file. Remove it once an
# actionlint release knows ubuntu-26.04.
self-hosted-runner:
  labels:
    - ubuntu-26.04
