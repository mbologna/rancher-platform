---
# End-to-end test: create an EC2 host, deploy twice (the second run must report changed=0),
# check the Rancher API, then destroy everything. Manual trigger only; it costs money.
#
# Needs the repository secret AWS_ROLE_ARN: an IAM role trusted by GitHub's OIDC provider
# for this repository, allowed to manage EC2 (instances, VPCs, security groups, key pairs, EIPs).
name: Deploy test

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system of the test host
        type: choice
        default: leap16
        options: [leap16, sles15, ubuntu24, ubuntu22]
      ingress:
        description: RKE2 ingress controller
        type: choice
        default: traefik
        options: [traefik, ingress-nginx]
      region:
        description: AWS region
        default: eu-west-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-test-${{ inputs.os }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ inputs.region }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Install Ansible
        run: |
          pip install --quiet 'ansible-core>=2.20,<2.21'
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Prepare SSH key, secrets and tfvars
        run: |
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/ci_ed25519
          password=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')
          echo "::add-mask::${password}"
          printf 'rancher_bootstrap_password: "%s"\n' "${password}" > ansible/group_vars/all/secrets.yml

          case "${{ inputs.os }}" in
            leap16)   user=ec2-user owner=679593333241 filter='openSUSE-Leap-16-0-v*-hvm-ssd-x86_64*' ;;
            sles15)   user=ec2-user owner=013907871322 filter='suse-sles-15-sp7-v*-hvm-ssd-x86_64' ;;
            ubuntu24) user=ubuntu owner=099720109477
                      filter='ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*' ;;
            ubuntu22) user=ubuntu owner=099720109477 filter='ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*' ;;
          esac
          runner_ip=$(curl -fsS https://checkip.amazonaws.com)
          cat > terraform/terraform.tfvars <<EOF
          aws_region            = "${AWS_REGION}"
          project_name          = "rp-ci-${GITHUB_RUN_ID}"
          environment           = "ci"
          public_key_path       = "~/.ssh/ci_ed25519.pub"
          ansible_user          = "${user}"
          ami_owner             = "${owner}"
          ami_name_filter       = "${filter}"
          allowed_ssh_cidrs     = ["${runner_ip}/32"]
          allowed_admin_cidrs   = ["${runner_ip}/32"]
          allowed_cluster_cidrs = ["10.0.0.0/16"]
          EOF

      - name: Create the host
        working-directory: terraform
        run: |
          tofu init -input=false
          tofu apply -auto-approve -input=false

      - name: Wait for SSH
        run: |
          ip=$(tofu -chdir=terraform output -raw rancher_public_ip)
          for _ in $(seq 60); do nc -z -w 3 "${ip}" 22 && exit 0; sleep 5; done
          exit 1

      - name: Deploy
        working-directory: ansible
        run: ./manage.sh deploy -e rke2_ingress_controller=${{ inputs.ingress }}

      - name: Deploy again (must change nothing)
        working-directory: ansible
        run: |
          ./manage.sh deploy -e rke2_ingress_controller=${{ inputs.ingress }} | tee ../deploy2.log
          grep -A1 'PLAY RECAP' ../deploy2.log | grep -q ' changed=0 '

      - name: Check the Rancher API
        run: |
          url=$(tofu -chdir=terraform output -raw rancher_url)
          curl -fsSk --retry 10 --retry-delay 10 --retry-all-errors "${url}/ping"
          ./ansible/manage.sh status

      - name: Destroy
        if: always()
        working-directory: terraform
        run: tofu destroy -auto-approve -input=false
