---
# Keeps a release pull request open with the next version and changelog, built from the
# Conventional Commit titles on main. Merging it tags the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: mbologna/.github/.github/workflows/release-please.yml@5758196b1c58ee6525a87f27d515e2f02495e2cc # main
    permissions:
      contents: write
      pull-requests: write
