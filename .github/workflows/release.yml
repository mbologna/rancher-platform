---
# Keeps a release pull request open with the next version and changelog, built from the
# Conventional Commit titles on main. Merging it tags the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: mbologna/.github/.github/workflows/release-please.yml@34c6d98db62827e2f7d2255e8f14f68ae640f578 # main
    permissions:
      contents: write
      pull-requests: write
