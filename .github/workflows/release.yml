---
# Keeps a release pull request open with the next version and changelog, built from the
# Conventional Commit titles on main. Merging it tags the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: mbologna/.github/.github/workflows/release-please.yml@83a94cc1bdc464afe31abb9cb99a575e5a8a38ef # main
    permissions:
      contents: write
      pull-requests: write
