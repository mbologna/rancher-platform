---
# Keeps a release pull request open with the next version and changelog, built from the
# Conventional Commit titles on main. Merging it tags the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: mbologna/.github/.github/workflows/release-please.yml@2f98255e6e61d77faf37b5f6fb84208682cb5ff2 # main
    permissions:
      contents: write
      pull-requests: write
