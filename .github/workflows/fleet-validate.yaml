---
name: Fleet manifests

# The fleet/ templates: provider pins against the Turtles catalogue, the schema
# validation and the unit tests. No paths filter: validate is a required check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      # Fails fast on a head that Provider sync is about to replace with the synced pins.
      - name: Check the provider pins against the Turtles catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-providers.py --check
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.2
      - name: Install yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.54.3
        run: |
          base="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo "${RUNNER_TEMP}/bin/yq" "${base}/yq_linux_amd64"
          curl -fsSLo "${RUNNER_TEMP}/checksums" "${base}/checksums"
          curl -fsSLo "${RUNNER_TEMP}/checksums_hashes_order" "${base}/checksums_hashes_order"
          # checksums lists every hash of a file on one line, in the order checksums_hashes_order gives.
          sha256=$(awk 'NR == FNR { if ($0 == "SHA-256") column = NR + 1; next }
            $1 == "yq_linux_amd64" { print $column }' \
            "${RUNNER_TEMP}/checksums_hashes_order" "${RUNNER_TEMP}/checksums")
          echo "${sha256}  ${RUNNER_TEMP}/bin/yq" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/yq"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Install schema validator
        run: python3 -m pip install -r requirements-validation.txt
      # Renovate dates CCM releases by their GitHub tag, which can come before
      # registry.k8s.io serves the image; an automerged patch must not pin one
      # that clusters can't pull.
      - name: Check the pinned AWS CCM images are published
        run: |
          image='registry\.k8s\.io/provider-aws/cloud-controller-manager:[^[:space:]"]*'
          grep -ho "${image}" clusterclasses/aws-rke2/*.yaml \
            | sort -u | while read -r ref; do
              docker manifest inspect "$ref" >/dev/null || { echo "::error::$ref is not published yet"; exit 1; }
              echo "$ref is published"
            done
      - name: Validate manifests and references
        run: python3 scripts/validate-repo.py --schemas
      - name: Test manifest checks
        run: python3 -m unittest discover -s tests
