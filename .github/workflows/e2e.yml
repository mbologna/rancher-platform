---
# Deploys RKE2, cert-manager, Rancher and one imported kind cluster on the runner itself, then
# checks that a second deploy changes nothing and that Rancher answers. Nothing leaves the runner.
# The weekly run uses Rancher's head build; a failure there is mailed to the workflow owner.
name: E2E

on:
  pull_request:
    paths:
      - ansible/**
      - .github/workflows/e2e.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      rancher_image_tag:
        description: Rancher image tag, e.g. head or v2.15-head (empty uses the pinned release)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      REQUESTED_TAG: ${{ github.event_name == 'schedule' && 'head' || inputs.rancher_image_tag }}
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: |
          pip install -r requirements-ci.txt
          ./manage.sh install

      # The runner is the target host. Docker is already installed, so the playbook leaves it alone.
      # A moving tag such as head can be rebuilt between the two deploys; pin it to the commit tag
      # that has the same digest so the rerun compares the same image.
      - name: Resolve the Rancher image tag
        if: env.REQUESTED_TAG != ''
        run: |
          api=https://hub.docker.com/v2/repositories/rancher/rancher/tags
          digest=$(curl -fsS "${api}/${REQUESTED_TAG}" | jq -r .digest)
          tag=$(curl -fsS "${api}?name=-head&page_size=100" |
            jq -r --arg d "${digest}" '[.results[] | select(.digest == $d)
              | .name | select(test("^v[0-9.]+-[0-9a-f]{40}-head$"))][0] // empty')
          echo "RANCHER_IMAGE_TAG=${tag:-${REQUESTED_TAG}}" | tee -a "${GITHUB_ENV}"

      - name: Write the inventory and secrets
        run: |
          ip=$(hostname -I | awk '{print $1}')
          cat > inventory/hosts.yml <<INVENTORY
          servers:
            hosts:
              runner:
                ansible_connection: local
                ansible_host: ${ip}
                ansible_user: ${USER}
                install_docker: false
                rancher_image_tag: "${RANCHER_IMAGE_TAG}"
                downstream_clusters: [e2e]
                registry_cache_enabled: true
                fleet_apps:
                  - {name: podinfo, repo: "https://github.com/stefanprodan/podinfo", paths: [charts/podinfo],
                     ingress: {service: podinfo-charts-podinfo, port: 9898}}
          INVENTORY
          password=$(openssl rand -hex 16)
          echo "::add-mask::${password}"
          echo "rancher_bootstrap_password: \"${password}\"" > group_vars/all/secrets.yml
          echo "RANCHER_HOSTNAME=rancher.${ip}.sslip.io" >> "${GITHUB_ENV}"
          echo "HOST_IP=${ip}" >> "${GITHUB_ENV}"

      - name: Deploy
        run: ./manage.sh deploy

      - name: Save AI settings as the UI would
        run: |
          kubeconfig=/etc/rancher/rke2/rke2.yaml
          sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ai-agent-system \
            patch configmap llm-config --type merge -p '{"data":{"OLLAMA_MODEL":"gpt-oss:20b"}}'
          sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ai-agent-system \
            patch secret llm-secret --type merge \
            -p '{"stringData":{"OLLAMA_URL":"http://ollama.example.invalid:11434"}}'

      # Adopt the UI-managed settings into the Helm release before checking idempotence.
      - name: Deploy with saved AI settings
        run: ./manage.sh deploy --tags rancher_ai

      - name: Deploy again and expect no changes
        run: |
          ./manage.sh deploy | tee "${RUNNER_TEMP}/rerun.log"
          grep -E '^runner +: .* changed=0 .* failed=0 ' "${RUNNER_TEMP}/rerun.log"

      - name: Show status
        run: ./manage.sh status

      - name: Check that Rancher AI is installed without a provider
        run: |
          kubeconfig=/etc/rancher/rke2/rke2.yaml
          for deployment in rancher-ai-agent rancher-mcp-server; do
            sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ai-agent-system \
              rollout status "deployment/${deployment}" --timeout=120s
          done
          sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ui-plugin-system \
            get uiplugin rancher-ai-ui -o json | \
            jq -e '.spec.plugin.name == "rancher-ai-ui" and .status.ready == true'
          sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ai-agent-system \
            get configmap llm-config -o json | \
            jq -e '.data.ACTIVE_LLM == "" and .data.OLLAMA_MODEL == "gpt-oss:20b"'
          sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" -n cattle-ai-agent-system \
            get secret llm-secret -o json | \
            jq -e '(.data.OLLAMA_URL | @base64d) == "http://ollama.example.invalid:11434"'

      - name: Check that Rancher answers
        run: |
          test "$(curl -fsSk "https://${RANCHER_HOSTNAME}/ping")" = pong
          /usr/local/bin/kubectl --kubeconfig ~/.kube/rancher-platform.yaml get nodes
          /usr/local/bin/kubectl --kubeconfig ~/.kube/rancher-platform.yaml \
            wait clusters.provisioning.cattle.io/e2e -n fleet-default \
            --for=jsonpath='{.status.ready}'=true --timeout=60s

      - name: Check that Fleet deployed podinfo to both clusters
        run: |
          for kubeconfig in /etc/rancher/rke2/rke2.yaml /root/.rancher-dev/kind-e2e.yaml; do
            sudo /usr/local/bin/kubectl --kubeconfig "${kubeconfig}" \
              rollout status deployment/podinfo-charts-podinfo -n default --timeout=120s
          done
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
            "http://podinfo.${RANCHER_HOSTNAME#rancher.}" | grep -q '"hostname"'

      - name: Check that the clusters pulled through the registry cache
        run: curl -fsS "http://${HOST_IP}:5001/v2/_catalog" | grep -q rancher/rancher-agent

      - name: Show cluster state
        if: failure()
        run: |
          sudo /usr/local/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get pods -A || true
          sudo journalctl -u rke2-server --no-pager -n 100 || true
          sudo /usr/local/bin/kubectl --kubeconfig /root/.rancher-dev/kind-e2e.yaml get pods -A || true
          df -h /
