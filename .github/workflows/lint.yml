---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # OpenTofu fmt/validate, tflint, yamllint, actionlint and a trivy config scan,
  # from mbologna/.github's shared Terraform workflow.
  terraform:
    uses: mbologna/.github/.github/workflows/terraform-ci.yml@5758196b1c58ee6525a87f27d515e2f02495e2cc # main
    # contents: write only because the shared workflow's terraform-docs job
    # declares it; that job is off here (enable_terraform_docs defaults to false).
    permissions:
      contents: write
      security-events: write
    with:
      working_dir: terraform
      opentofu_version: "1.13.1"

  # The rest of the pre-commit hooks (ansible-lint, shellcheck, yamllint, ...).
  # The Terraform ones are skipped: the job above runs them with pinned tools.
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run pre-commit
        env:
          SKIP: terraform_fmt,terraform_tflint
        run: |
          pip install -r .github/requirements-lint.txt
          pre-commit run --all-files --show-diff-on-failure
