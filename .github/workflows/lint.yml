---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # OpenTofu fmt/validate, tflint, yamllint, actionlint and a trivy config scan,
  # from mbologna/.github's shared Terraform workflow.
  terraform:
    uses: mbologna/.github/.github/workflows/terraform-ci.yml@b6ef2e0e959b0f8d3c64c7b3c86f8736229b74a0 # main
    # security-events: the Trivy IaC scan's SARIF upload.
    permissions:
      contents: read
      security-events: write
    with:
      working_dir: terraform
      opentofu_version: "1.13.9"

  # The rest of the pre-commit hooks (ansible-lint, shellcheck, yamllint, ...).
  # The Terraform ones are skipped: the job above runs them with pinned tools.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Run pre-commit
        env:
          SKIP: terraform_fmt,terraform_tflint
        run: |
          pip install -r .github/requirements-lint.txt
          pre-commit run --all-files --show-diff-on-failure

  # Relative links and #anchors between the Markdown files. --offline skips
  # external URLs, so the check does not depend on other sites being up.
  links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress .
