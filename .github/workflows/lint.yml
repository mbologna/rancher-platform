---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # OpenTofu fmt/validate, tflint, yamllint, actionlint and a trivy config scan,
  # from mbologna/.github's shared Terraform workflow.
  terraform:
    uses: mbologna/.github/.github/workflows/terraform-ci.yml@6b27ea5df28753e6514ee41e4b967fdad3953400 # main
    # security-events: the Trivy IaC scan's SARIF upload.
    permissions:
      contents: read
      security-events: write
    with:
      working_dir: terraform
      opentofu_version: "1.13.9"

  # The rest of the pre-commit hooks (ansible-lint, shellcheck, yamllint, ...).
  # The Terraform ones are skipped: the job above runs them with pinned tools.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Run pre-commit
        env:
          SKIP: terraform_fmt,terraform_tflint
        run: uv run --locked --only-group lint pre-commit run --all-files --show-diff-on-failure

  # Relative links and #anchors between the Markdown files. --offline skips
  # external URLs, so the check does not depend on other sites being up.
  links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress .
