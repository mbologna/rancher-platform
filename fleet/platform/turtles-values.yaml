# Merge into the platform-owned rancher-turtles release, never Fleet.
# scripts/sync-providers.py sets rancher-version from rancher_version in
# ansible/group_vars/all/config.yml, and the versions below from that Rancher release.
# rancher-version: v2.15.3
# renovate: datasource=github-releases depName=rancher/turtles
# chart-version: v0.27.4
cluster-api-operator:
  cluster-api:
    enabled: true
    configSecret:
      name: repo-capi-config
    core:
      namespace: cattle-capi-system
      # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
      version: v1.13.3
      enableAutomaticUpdate: false
