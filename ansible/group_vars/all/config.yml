---
# Central configuration. Every version pin below is tracked by Renovate (see renovate.json).

# renovate: datasource=github-releases depName=rancher/rke2
rke2_version: "v1.36.5+rke2r1"
# etcd snapshots: RKE2 writes them to /var/lib/rancher/rke2/server/db/snapshots on the host.
rke2_etcd_snapshot_schedule: "0 */12 * * *"
rke2_etcd_snapshot_retention: 5
# Set a bucket to also upload snapshots to S3 (or an S3-compatible endpoint). Keys go in
# secrets.yml (rke2_etcd_s3_access_key, rke2_etcd_s3_secret_key); without them RKE2 uses the
# host's AWS credentials, such as an EC2 instance profile.
rke2_etcd_s3_bucket: ""
rke2_etcd_s3_region: us-east-1
rke2_etcd_s3_folder: ""
rke2_etcd_s3_endpoint: s3.amazonaws.com

# renovate: datasource=github-releases depName=cert-manager/cert-manager
cert_manager_version: "v1.21.2"

# Rancher installs Turtles itself (2.15.2: Turtles v0.27.2, core CAPI v1.13.3).
# renovate: datasource=helm depName=rancher registryUrl=https://releases.rancher.com/server-charts/stable
rancher_version: "2.15.2"
# Chart channel: stable, latest (adds release candidates such as 2.15.2-rc1) or alpha.
rancher_chart_channel: stable
rancher_chart_repo: https://releases.rancher.com/server-charts/{{ rancher_chart_channel }}
# Development builds: rancher_image_tag: head (the next minor) or v2.15-head runs that build on the
# chart above. Moving tags (head, *-head) are pulled again on every deploy when the registry has a
# newer image. rancher_image replaces rancher/rancher, for example with your own build.
rancher_image: ""
rancher_image_tag: ""
# Merged last into the chart values, e.g. {extraEnv: [{name: CATTLE_FEATURES, value: "..."}]}.
rancher_extra_values: {}
# Rancher settings (management.cattle.io Setting name: value), e.g. ui-dashboard-index for UI work.
rancher_settings: {}
# Name Rancher answers on. Set it per host in the inventory to override the default: the host's
# address when it is a DNS name (erlara.example.com), otherwise rancher.<ip>.sslip.io.
rancher_hostname: >-
  {{ rancher_host_address if rancher_host_address is match('^(?![0-9.]+$)[^:]+\.[^:]+$')
     else 'rancher.' ~ (rancher_host_address if rancher_host_address is match('^[0-9.]+$')
                        else ansible_facts.default_ipv4.address) ~ '.sslip.io' }}
rancher_host_address: "{{ ansible_host | default(inventory_hostname) }}"
# TLS for the Rancher ingress: "rancher" (self-signed CA) or "letsEncrypt" (HTTP-01; port 80 must be
# reachable from the internet and rancher_hostname must resolve publicly).
rancher_tls_source: rancher
rancher_letsencrypt_email: ""
# "production" or "staging" (staging certificates are untrusted but have looser rate limits).
rancher_letsencrypt_environment: production

# renovate: datasource=github-releases depName=helm/helm
helm_version: "v3.22.1"
# renovate: datasource=github-releases depName=databus23/helm-diff
helm_diff_version: "v3.15.15"

# Docker on the host is required by the CAPD (Docker) infrastructure provider.
install_docker: true
# Install the CAPD provider and its "kind" network. Set true with install_docker: false when
# the host already runs Docker.
capd_enabled: "{{ install_docker }}"

# Registry cache: one pull-through proxy (Docker's registry image) per upstream registry on this host,
# with the cache in a Docker volume rp-registry-<registry>. RKE2 and the kind clusters pull through it and
# fall back to the upstream when it is down, so resets and new clusters reuse cached images. Needs Docker.
# For Docker Hub's higher pull limit, set registry_cache_dockerhub_username/password in secrets.yml.
registry_cache_enabled: false
registry_cache_upstreams:
  - {registry: docker.io, url: "https://registry-1.docker.io", port: 5001}
  - {registry: ghcr.io, url: "https://ghcr.io", port: 5002}
  - {registry: quay.io, url: "https://quay.io", port: 5003}
  - {registry: registry.k8s.io, url: "https://registry.k8s.io", port: 5004}
# Address the caches listen on; RKE2 and the kind nodes must reach it.
registry_cache_address: "{{ ansible_facts.default_ipv4.address }}"
# renovate: datasource=docker depName=registry
registry_cache_image_version: "3.1.2"
# Registry name -> mirror URL, empty when the cache is off.
registry_cache_mirrors: >-
  {{ dict(registry_cache_upstreams | map(attribute='registry')
          | zip(registry_cache_upstreams | map(attribute='port') | map('string')
                | map('regex_replace', '^', 'http://' ~ registry_cache_address ~ ':')))
     if registry_cache_enabled | bool else {} }}

# Leap 16 / SLE 16 enforce SELinux by default; RKE2's tarball install does not ship the
# rke2-selinux policy. Set to "" to leave the host's SELinux mode untouched.
selinux_mode: permissive

# Wipe RKE2/k3s/kind/k3d/Docker state before deploying. Destructive; use `./manage.sh reset`.
reset: false

# Install CAPI providers (CAPRKE2, CAPD, and CAPA when AWS keys are set in secrets.yml) with the
# rancher-turtles-providers chart. Versions and settings come from rancher-fleet-clusters.
capi_providers_enabled: false
capi_providers_values_url: >-
  https://raw.githubusercontent.com/mbologna/rancher-fleet-clusters/main/platform/providers-values.yaml
# Region written to CAPA's credentials profile.
capa_aws_region: eu-west-1

# Downstream clusters: kind clusters on this host, imported into Rancher. Each entry is a name (a
# lowercase DNS label) or {name: ..., kubernetes_version: v1.35.8, labels: {env: dev}}: the version picks
# a node image from the kind release below when the cluster is created, and the labels go on the Rancher
# cluster, where Fleet can target them. Each cluster uses about 1 GB of RAM.
# Removing an entry deletes its cluster on the next deploy. Needs Docker (install_docker or a host that
# already runs it).
# An entry with type: rke2 is an RKE2 cluster that Rancher provisions on Docker containers on this host
# (a custom cluster): {name, type: rke2, kubernetes_version: v1.35.4+rke2r1, nodes: 3, labels}. The first
# node runs etcd, the control plane and workloads; the others are workers. The version defaults to
# rke2_version and must be one Rancher offers; changing it upgrades the cluster, and changing nodes adds or
# removes workers. Each node uses about 2 GB of RAM.
downstream_clusters: []
# renovate: datasource=github-releases depName=kubernetes-sigs/kind
kind_version: "v0.33.0"
# Default node version. Rancher 2.15 manages Kubernetes 1.34-1.36; kind v0.33.0 lists v1.34.11, v1.35.8
# and v1.36.4.
# renovate: datasource=docker depName=kindest/node
kind_node_version: "v1.36.4"
# Node image of rke2 clusters: a systemd image from Rancher's provisioning tests.
# renovate: datasource=docker depName=rancher/systemd-node
rke2_node_image_version: "v0.0.9"
# metrics-server in each kind cluster, so kubectl top and HorizontalPodAutoscalers work.
downstream_metrics_server: false
# renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server
metrics_server_version: "3.14.0"

# Fleet apps: Git repositories that Fleet deploys to the Rancher cluster (workspace fleet-local) and the
# imported ones (fleet-default). Each entry is {name, repo, paths} plus optional
#   branch          Fleet defaults to master
#   workspaces      default [fleet-local, fleet-default]
#   targets         Fleet GitRepo targets; default [{clusterSelector: {}}], every cluster in the workspace
#   keep_resources  leave the deployed resources in place when the app is removed; default false
# Removing an entry removes the app on the next deploy. For the samples below, set
# fleet_apps: "{{ fleet_apps_examples }}"; combine lists with +. An entry with
# ingress: {service, port, namespace} also gets an Ingress on the Rancher cluster at
# http://<name>.<fleet_apps_ingress_domain>.
fleet_apps: []
fleet_apps_examples:
  # The Helm chart leaves the HPA off; kind clusters have no metrics-server, so an HPA never turns Ready.
  - name: podinfo
    repo: https://github.com/stefanprodan/podinfo
    paths: [charts/podinfo]
    ingress: {service: podinfo-charts-podinfo, port: 9898}
  - name: guestbook
    repo: https://github.com/rancher/fleet-examples
    paths: [simple]
    ingress: {service: frontend, port: 80}
  - name: guestbook-helm
    repo: https://github.com/rancher/fleet-examples
    paths: [single-cluster/helm]
  # Varies replicas and Redis replication by the cluster label env (dev, test or prod); prod asks for a
  # LoadBalancer Service, which kind clusters cannot provide.
  - name: guestbook-multi
    repo: https://github.com/rancher/fleet-examples
    paths: [multi-cluster/helm]

# ClusterClasses and example clusters from rancher-fleet-clusters, for Rancher Turtles. Needs
# capi_providers_enabled. keep_resources stops Fleet deleting CAPI clusters when the app is removed.
# Wildcard DNS for app Ingresses: the sslip.io domain of rancher_hostname, else of the host's IP.
fleet_apps_ingress_domain: >-
  {{ rancher_hostname | regex_replace('^rancher\\.', '') if rancher_hostname is search('\\.sslip\\.io$')
     else ansible_facts.default_ipv4.address ~ '.sslip.io' }}

fleet_apps_capi_templates:
  - name: capi-cluster-templates
    repo: https://github.com/mbologna/rancher-fleet-clusters
    branch: main
    paths: [clusterclasses, identities, clusters]
    workspaces: [fleet-local]
    keep_resources: true

# Helm charts on the Rancher cluster: {name, chart, repo, version, namespace, values}; chart defaults
# to name. reuse_secret_values: [{secret, key, value}] passes a value the chart generated on its first
# install, read from that Secret, back to it on later deploys, so the release stays unchanged.
# Deploy uninstalls charts it installed that are no longer listed. Presets below; combine with +, e.g.
# helm_charts: "{{ helm_charts_monitoring + helm_charts_backup }}".
helm_charts: []
# Rancher's chart line follows its minor: 110.x is for Rancher 2.15.
# renovate: datasource=helm depName=rancher-monitoring registryUrl=https://charts.rancher.io
rancher_monitoring_version: "110.0.2+up80.9.1-rancher.22"
# renovate: datasource=helm depName=rancher-backup registryUrl=https://charts.rancher.io
rancher_backup_version: "110.0.2+up11.0.3"
# Prometheus, Grafana and Alertmanager, shown under Monitoring in the Rancher UI. Needs about 2 GB RAM.
helm_charts_monitoring:
  - {name: rancher-monitoring-crd, repo: "https://charts.rancher.io", version: "{{ rancher_monitoring_version }}",
     namespace: cattle-monitoring-system}
  - name: rancher-monitoring
    repo: https://charts.rancher.io
    version: "{{ rancher_monitoring_version }}"
    namespace: cattle-monitoring-system
    values:
      global: {cattle: {clusterId: local, clusterName: local}}
      rke2ControllerManager: {enabled: true}
      rke2Scheduler: {enabled: true}
      rke2Proxy: {enabled: true}
      rke2Etcd: {enabled: true}
# The Rancher Backups operator. Backups need a storage location: S3 or a Backup's own storage.
helm_charts_backup:
  - {name: rancher-backup-crd, repo: "https://charts.rancher.io", version: "{{ rancher_backup_version }}",
     namespace: cattle-resources-system}
  - {name: rancher-backup, repo: "https://charts.rancher.io", version: "{{ rancher_backup_version }}",
     namespace: cattle-resources-system}
# renovate: datasource=helm depName=kubewarden-crds registryUrl=https://charts.kubewarden.io
kubewarden_crds_version: "1.28.1"
# renovate: datasource=helm depName=kubewarden-controller registryUrl=https://charts.kubewarden.io
kubewarden_controller_version: "5.14.1"
# renovate: datasource=helm depName=kubewarden-defaults registryUrl=https://charts.kubewarden.io
kubewarden_defaults_version: "3.14.1"
# Kubewarden admission policies: the controller and its default PolicyServer, without policies.
helm_charts_kubewarden:
  - {name: kubewarden-crds, repo: "https://charts.kubewarden.io", version: "{{ kubewarden_crds_version }}",
     namespace: kubewarden}
  - {name: kubewarden-controller, repo: "https://charts.kubewarden.io",
     version: "{{ kubewarden_controller_version }}", namespace: kubewarden}
  - {name: kubewarden-defaults, repo: "https://charts.kubewarden.io", version: "{{ kubewarden_defaults_version }}",
     namespace: kubewarden}
# renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io
longhorn_version: "1.13.0"
# Longhorn block storage, with one replica per volume because there is one node. Its StorageClass
# "longhorn" is not the default. Listing a release named longhorn makes base install open-iscsi and
# the NFS client on the host.
helm_charts_longhorn:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: "{{ longhorn_version }}"
    namespace: longhorn-system
    values:
      persistence: {defaultClass: false, defaultClassReplicaCount: 1}
      defaultSettings: {defaultReplicaCount: 1}
# renovate: datasource=helm depName=harbor registryUrl=https://helm.goharbor.io
harbor_version: "1.19.4"
# Harbor container registry at http://harbor.<fleet_apps_ingress_domain>, for testing private
# registries. Its data is in emptyDir volumes and is lost when a pod restarts. The admin password is
# harbor_admin_password from secrets.yml, else rancher_bootstrap_password.
helm_charts_harbor:
  - name: harbor
    repo: https://helm.goharbor.io
    version: "{{ harbor_version }}"
    namespace: harbor
    values:
      expose:
        type: ingress
        tls: {enabled: false}
        ingress:
          className: traefik
          hosts: {core: "harbor.{{ fleet_apps_ingress_domain }}"}
      externalURL: "http://harbor.{{ fleet_apps_ingress_domain }}"
      harborAdminPassword: "{{ harbor_admin_password | default(rancher_bootstrap_password) }}"
      persistence: {enabled: false}
    reuse_secret_values:
      - {secret: harbor-core, key: tls.key, value: core.tokenKey}
      - {secret: harbor-core, key: tls.crt, value: core.tokenCert}
      - {secret: harbor-registry-htpasswd, key: REGISTRY_HTPASSWD, value: registry.credentials.htpasswdString}

# ── Paths (defined once, used everywhere) ────────────────────────────────────
rancher_dev_dir: /root/.rancher-dev
rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
rke2_kubeconfig_external: "{{ rancher_dev_dir }}/rke2-kubeconfig-external.yaml"
local_kubeconfig: ~/.kube/rancher-platform.yaml
# The local kubeconfig reaches the local and downstream clusters through Rancher on port 443, with a
# 30-day Rancher token. false fetches the RKE2 admin kubeconfig instead (port 6443, local cluster only).
kubeconfig_via_rancher: true
kubeconfig_refresh: false
# Context, cluster and user names: <name> for the Rancher host, <name>-<cluster> for downstream clusters.
# Distinct names let you merge the files of several hosts.
kubeconfig_context_name: "{{ inventory_hostname }}"
k8s_venv: /opt/rancher-platform/venv
k8s_python: "{{ k8s_venv }}/bin/python"
bin_dir: /usr/local/bin
kubectl_bin: "{{ bin_dir }}/kubectl"
rke2_bin: "{{ rke2_install_prefix }}/bin/rke2"
rke2_snapshot_dir: /var/lib/rancher/rke2/server/db/snapshots
helm_bin: "{{ bin_dir }}/helm"
# Pinned because get.rke2.io falls back to /opt/rke2 when /usr/local is a mount point (Leap 16 btrfs).
rke2_install_prefix: /usr/local

# Credentials live in secrets.yml (gitignored). Copy secrets.yml.example to get started.
