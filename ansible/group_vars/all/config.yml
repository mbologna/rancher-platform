---
# Central configuration. Every version pin below is tracked by Renovate (see renovate.json).

# renovate: datasource=github-releases depName=rancher/rke2
rke2_version: "v1.34.6+rke2r3"
# Ingress controller RKE2 deploys: traefik or ingress-nginx (retired upstream in March 2026).
# Changing it on an existing host restarts RKE2 and replaces the controller.
rke2_ingress_controller: traefik

# renovate: datasource=github-releases depName=cert-manager/cert-manager
cert_manager_version: "v1.21.2"

# Rancher installs Turtles itself (2.15.2: Turtles v0.27.2, core CAPI v1.13.3).
# renovate: datasource=helm depName=rancher registryUrl=https://releases.rancher.com/server-charts/stable
rancher_version: "2.15.2"
rancher_chart_repo: https://releases.rancher.com/server-charts/stable
# TLS for the Rancher ingress: "rancher" (self-signed CA) or "letsEncrypt" (HTTP-01; port 80 must be
# reachable from the internet and rancher_hostname must resolve publicly).
rancher_tls_source: rancher
rancher_letsencrypt_email: ""
# "production" or "staging" (staging certificates are untrusted but have looser rate limits).
rancher_letsencrypt_environment: production

# renovate: datasource=github-releases depName=helm/helm
helm_version: "v3.22.1"
# renovate: datasource=github-releases depName=databus23/helm-diff
helm_diff_version: "v3.15.15"

# Docker on the host is required by the CAPD (Docker) infrastructure provider.
install_docker: true

# Leap 16 / SLE 16 enforce SELinux by default; RKE2's tarball install does not ship the
# rke2-selinux policy. Set to "" to leave the host's SELinux mode untouched.
selinux_mode: permissive

# Wipe RKE2/k3s/kind/k3d/Docker state before deploying. Destructive; use `./manage.sh reset`.
reset: false

# Install CAPI providers (CAPRKE2, CAPD, and CAPA when AWS keys are set in secrets.yml) with the
# rancher-turtles-providers chart. Versions and settings come from rancher-fleet-clusters.
capi_providers_enabled: false
capi_providers_values_url: >-
  https://raw.githubusercontent.com/mbologna/rancher-fleet-clusters/main/platform/providers-values.yaml
# Region written to CAPA's credentials profile.
capa_aws_region: eu-west-1

# Optionally register rancher-fleet-clusters as a Fleet GitRepo once Rancher is up.
fleet_gitrepo_enabled: false
fleet_gitrepo_manifest_url: https://raw.githubusercontent.com/mbologna/rancher-fleet-clusters/main/gitrepo.yaml

# ── Paths (defined once, used everywhere) ────────────────────────────────────
rancher_dev_dir: /root/.rancher-dev
rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
rke2_kubeconfig_external: "{{ rancher_dev_dir }}/rke2-kubeconfig-external.yaml"
local_kubeconfig: ~/.kube/rancher-platform.yaml
k8s_venv: /opt/rancher-platform/venv
k8s_python: "{{ k8s_venv }}/bin/python"
bin_dir: /usr/local/bin
kubectl_bin: "{{ bin_dir }}/kubectl"
helm_bin: "{{ bin_dir }}/helm"
# Pinned because get.rke2.io falls back to /opt/rke2 when /usr/local is a mount point (Leap 16 btrfs).
rke2_install_prefix: /usr/local

# Credentials live in secrets.yml (gitignored). Copy secrets.yml.example to get started.
