---
# Writes local_kubeconfig on this machine. By default every context goes through Rancher on port 443
# (/k8s/clusters/<id>), so it works where port 6443 is filtered and includes the downstream clusters.
# The file is regenerated only when its token stops working or the cluster list changes.
- name: Fetch the direct RKE2 kubeconfig
  ansible.builtin.fetch:
    src: "{{ rke2_kubeconfig_external }}"
    dest: "{{ local_kubeconfig }}"
    flat: true
  when: not kubeconfig_via_rancher | bool

- name: Write a kubeconfig that goes through Rancher
  when: kubeconfig_via_rancher | bool
  block:
    - name: Read the current local kubeconfig
      ansible.builtin.slurp:
        src: "{{ local_kubeconfig | expanduser }}"
      delegate_to: localhost
      become: false
      register: kubeconfig_current
      failed_when: false
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: List the clusters Rancher manages
      ansible.builtin.command: >-
        {{ kubectl_bin }} get clusters.management.cattle.io -o jsonpath={.items[*].metadata.name}
      register: kubeconfig_clusters
      changed_when: false

    # A reinstalled Rancher has a new self-signed CA, while the old token can still be valid.
    - name: Read the Rancher CA
      ansible.builtin.command: >-
        {{ kubectl_bin }} get settings.management.cattle.io cacerts -o jsonpath={.value}
      register: kubeconfig_cacerts
      changed_when: false

    - name: Compare the local kubeconfig with Rancher's clusters
      ansible.builtin.set_fact:
        kubeconfig_name: >-
          {{ kubeconfig_doc | regex_findall('(?m)^# name: (\S+)') | first | default('') }}
        kubeconfig_token: >-
          {{ kubeconfig_yaml.users | default([], true) | map(attribute='user.token', default='')
             | first | default('') }}
        kubeconfig_stale: >-
          {{ kubeconfig_refresh | bool
             or kubeconfig_yaml.clusters | default([]) | map(attribute='cluster.server') | sort
                != kubeconfig_clusters.stdout.split() | map('regex_replace', '^', kubeconfig_prefix) | sort
             or kubeconfig_yaml.clusters | default([]) | map(attribute='cluster')
                | map(attribute='certificate-authority-data', default='') | map('b64decode') | map('trim') | unique
                != [kubeconfig_cacerts.stdout | trim] }}
      no_log: true
      vars:
        kubeconfig_doc: "{{ kubeconfig_current.content | default('') | b64decode }}"
        kubeconfig_yaml: "{{ kubeconfig_doc | from_yaml or {} }}"
        kubeconfig_prefix: https://{{ rancher_hostname }}/k8s/clusters/

    - name: Check that the local kubeconfig token still works
      ansible.builtin.uri:
        url: https://{{ rancher_hostname }}/k8s/clusters/local/version
        headers:
          Authorization: Bearer {{ kubeconfig_token }}
        validate_certs: false
      register: kubeconfig_token_check
      failed_when: false
      no_log: true
      when: not kubeconfig_stale | bool

    - name: Generate a new kubeconfig through Rancher
      when: kubeconfig_stale | bool or kubeconfig_token_check.status | default(0) != 200
      block:
        - name: Log in to Rancher as admin
          ansible.builtin.uri:
            url: https://{{ rancher_hostname }}/v3-public/localProviders/local?action=login
            method: POST
            body_format: json
            body:
              username: admin
              password: "{{ rancher_admin_password | default(rancher_bootstrap_password) }}"
              responseType: json
              ttl: 600000
            status_code: [200, 201, 401]
            validate_certs: false
          register: kubeconfig_login
          no_log: true

        - name: Fall back to the direct RKE2 kubeconfig
          ansible.builtin.fetch:
            src: "{{ rke2_kubeconfig_external }}"
            dest: "{{ local_kubeconfig }}"
            flat: true
          when: kubeconfig_login.status == 401

        - name: Explain the fallback
          ansible.builtin.debug:
            msg: >-
              Rancher rejected the admin password, so {{ local_kubeconfig }} talks to the API server on
              port 6443. Set rancher_admin_password in secrets.yml if you changed it in the UI.
          when: kubeconfig_login.status == 401

        - name: Create the kubeconfig in Rancher
          ansible.builtin.uri:
            url: https://{{ rancher_hostname }}/v1/ext.cattle.io.kubeconfigs
            method: POST
            headers:
              Authorization: Bearer {{ kubeconfig_login.json.token }}
            body_format: json
            body:
              apiVersion: ext.cattle.io/v1
              kind: Kubeconfig
              metadata:
                generateName: rancher-platform-
              spec:
                clusters: ["*"]
                currentContext: local
                description: rancher-platform ({{ local_kubeconfig }})
                includeDefaultEntry: false
            status_code: [200, 201]
            validate_certs: false
          register: kubeconfig_created
          no_log: true
          when: kubeconfig_login.status != 401

        - name: Write the kubeconfig to this machine
          ansible.builtin.copy:
            content: "{{ kubeconfig_created.json.status.value }}"
            dest: "{{ local_kubeconfig | expanduser }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          when: kubeconfig_login.status != 401

        - name: Revoke the replaced kubeconfig {{ kubeconfig_name }}
          ansible.builtin.uri:
            url: https://{{ rancher_hostname }}/v1/ext.cattle.io.kubeconfigs/{{ kubeconfig_name }}
            method: DELETE
            headers:
              Authorization: Bearer {{ kubeconfig_login.json.token }}
            status_code: [200, 202, 204, 404]
            validate_certs: false
          no_log: true
          when: kubeconfig_login.status != 401 and kubeconfig_name | length > 0

        - name: Log out of Rancher
          ansible.builtin.uri:
            url: https://{{ rancher_hostname }}/v3/tokens?action=logout
            method: POST
            headers:
              Authorization: Bearer {{ kubeconfig_login.json.token }}
            status_code: [200, 204]
            validate_certs: false
          no_log: true
          changed_when: false
          when: kubeconfig_login.status != 401

- name: Keep the local kubeconfig private
  ansible.builtin.file:
    path: "{{ local_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
