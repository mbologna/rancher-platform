---
# Also the output of ./manage.sh status. Commands fail harmlessly while Rancher or its CRDs are missing.
- name: Read the cluster status
  ansible.builtin.command: "{{ kubectl_bin }} {{ item }}"
  loop:
    - get nodes -o wide
    - get clusters.provisioning.cattle.io -A
    - get gitrepos.fleet.cattle.io -A
    - get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded
  register: summary_status
  changed_when: false
  failed_when: false

- name: Read the Rancher IDs of the downstream clusters
  ansible.builtin.command: >-
    {{ kubectl_bin }} -n fleet-default get clusters.provisioning.cattle.io
    -o jsonpath='{range .items[*]}{.metadata.name}={.status.clusterName}{"\n"}{end}'
  register: summary_cluster_ids
  changed_when: false
  failed_when: false

# Each app's Ingress on the Rancher cluster, then Rancher's service proxy to the same Service on each
# downstream cluster (log in to the UI first).
- name: List the app URLs
  ansible.builtin.set_fact:
    summary_app_urls: >-
      {{ summary_app_urls | default([])
         + ['App ' ~ item[0].name ~ ':  http://' ~ item[0].name ~ '.' ~ fleet_apps_ingress_domain] if not item[1]
         else summary_app_urls + ['  on ' ~ item[1].split('=') | first ~ ':  https://' ~ rancher_hostname
              ~ '/k8s/clusters/' ~ item[1].split('=') | last ~ '/api/v1/namespaces/'
              ~ item[0].ingress.namespace | default('default') ~ '/services/http:' ~ item[0].ingress.service
              ~ ':' ~ item[0].ingress.port ~ '/proxy/'] }}
  loop: >-
    {{ fleet_apps | selectattr('ingress', 'defined')
       | product([''] + summary_cluster_ids.stdout_lines | default([]) | select('search', '=.') | list) | list }}
  loop_control:
    label: "{{ item[0].name }} {{ item[1] }}"

- name: Show summary
  ansible.builtin.debug:
    msg: >-
      {{ summary_lines + summary_app_urls | default([]) + ['']
         + summary_status.results | map(attribute='stdout_lines') | map('default', []) | zip_longest([], fillvalue=[''])
           | flatten | list }}
  vars:
    summary_lines:
      - "Rancher UI:  https://{{ rancher_hostname }}  (admin / rancher_bootstrap_password from secrets.yml)"
      - "Kubeconfig:  export KUBECONFIG={{ local_kubeconfig }}"
      - "SSH:         ssh {{ ansible_user | default('root') }}@{{ ansible_host }}  (kubectl works out of the box)"
      - >-
        Downstream:  {{ (downstream_clusters | select('string') | list
                         + downstream_clusters | reject('string') | map(attribute='name') | list) | join(', ')
                        if downstream_clusters else 'none (set downstream_clusters to import kind clusters)' }}
      - >-
        Fleet apps:  {{ fleet_apps | map(attribute='name') | join(', ') if fleet_apps
                        else 'none (set fleet_apps to deploy apps to every cluster)' }}
      - >-
        Helm charts: {{ helm_charts | map(attribute='name') | join(', ') if helm_charts
                        else 'none (set helm_charts to install charts such as helm_charts_monitoring)' }}
