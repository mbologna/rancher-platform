---
- name: Fetch the external kubeconfig to this machine
  ansible.builtin.fetch:
    src: "{{ rke2_kubeconfig_external }}"
    dest: "{{ local_kubeconfig }}"
    flat: true

- name: Keep the local kubeconfig private
  ansible.builtin.file:
    path: "{{ local_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Show cluster status
  ansible.builtin.command: "{{ bin_dir }}/cluster-status"
  register: summary_status
  changed_when: false

- name: Show summary
  ansible.builtin.debug:
    msg: "{{ summary_lines + [''] + summary_status.stdout_lines }}"
  vars:
    summary_lines:
      - "Rancher UI:  https://{{ rancher_hostname }}  (admin / rancher_bootstrap_password from secrets.yml)"
      - "Kubeconfig:  export KUBECONFIG={{ local_kubeconfig }}"
      - "SSH:         ssh {{ ansible_user | default('root') }}@{{ ansible_host }}  (kubectl works out of the box)"
      - "Helpers:     cluster-status, rancher-logs, port-forward-rancher, uninstall-rancher (sudo -i)"
      - "{{ summary_fleet_done if fleet_gitrepo_enabled | bool else summary_fleet_next }}"
    summary_fleet_done: "Fleet:       rancher-fleet-clusters registered as a GitRepo in fleet-local"
    summary_fleet_next: >-
      Next:        register https://github.com/mbologna/rancher-fleet-clusters
      (or redeploy with -e fleet_gitrepo_enabled=true)
