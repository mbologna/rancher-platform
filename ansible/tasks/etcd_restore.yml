---
# Restores RKE2 (and with it Rancher) from an etcd snapshot: a local one when it exists, else one in
# the S3 bucket (rke2_etcd_s3_bucket). kind clusters keep running and reconnect; their own workloads
# are not part of the snapshot.
- name: Find on the host snapshot {{ etcd_snapshot_name }}
  ansible.builtin.find:
    paths: "{{ rke2_snapshot_dir }}"
    patterns: ["{{ etcd_snapshot_name }}", "{{ etcd_snapshot_name }}-*"]
  register: etcd_restore_found

# Lists the local snapshots and the bucket's, reading S3 itself, so it also works on a rebuilt host.
- name: List the snapshots in S3
  ansible.builtin.command: "{{ rke2_bin }} etcd-snapshot list"
  register: etcd_restore_s3_list
  changed_when: false
  when:
    - etcd_restore_found.files | length == 0
    - rke2_etcd_s3_bucket | length > 0

# Columns: Name Location Size Created, with Location s3://<bucket>/... for the bucket's copies.
- name: Note the matching snapshots in S3
  ansible.builtin.set_fact:
    etcd_restore_s3_matches: >-
      {% set matches = [] %}{% for line in etcd_restore_s3_list.stdout_lines | default([]) %}{%
      set field = line.split() %}{% if field | length >= 4 and field[1].startswith('s3://')
      and (field[0] == etcd_snapshot_name or field[0].startswith(etcd_snapshot_name ~ '-')) %}{%
      set _ = matches.append({'name': field[0], 'created': field[3]}) %}{% endif %}{% endfor %}{{ matches }}

- name: Check that the snapshot exists
  ansible.builtin.assert:
    that: etcd_restore_found.files | length > 0 or etcd_restore_s3_matches | length > 0
    fail_msg: >-
      No snapshot named {{ etcd_snapshot_name }} in {{ rke2_snapshot_dir }}{{
      ' or in S3 bucket ' ~ rke2_etcd_s3_bucket if rke2_etcd_s3_bucket | length > 0 else '' }};
      ./manage.sh snapshots lists them.
    quiet: true

# RKE2 fetches a snapshot from S3 when its config has the bucket, unless told not to: a local
# restore passes --etcd-s3=false and the file's path, an S3 one only the snapshot's name.
- name: Pick the newest match
  ansible.builtin.set_fact:
    etcd_restore_args: >-
      {{ '--etcd-s3=false --cluster-reset-restore-path='
         ~ (etcd_restore_found.files | sort(attribute='mtime') | last).path
         if etcd_restore_found.files | length > 0
         else '--cluster-reset-restore-path='
         ~ (etcd_restore_s3_matches | sort(attribute='created') | last).name }}

- name: Stop RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    state: stopped

- name: Restore etcd with {{ etcd_restore_args }}
  ansible.builtin.command: "{{ rke2_bin }} server --cluster-reset {{ etcd_restore_args }}"
  changed_when: true

- name: Start RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    state: started

- name: Wait for the node to be Ready
  ansible.builtin.command: "{{ kubectl_bin }} wait nodes --all --for=condition=Ready --timeout=30s"
  register: etcd_restore_nodes
  until: etcd_restore_nodes.rc == 0
  retries: 30
  delay: 10
  changed_when: false

# The restored etcd revision is older than the one controllers were watching, so their caches go
# stale: canal stops routing new pods and the ingress keeps old endpoints. Restart them all,
# canal first so the rest get pod networking.
- name: Restart the CNI after the restore
  ansible.builtin.shell: >-
    {{ kubectl_bin }} -n kube-system rollout restart daemonset/rke2-canal &&
    {{ kubectl_bin }} -n kube-system rollout status daemonset/rke2-canal --timeout=5m
  changed_when: true

- name: Restart every workload after the restore
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ kubectl_bin }} get deployments,daemonsets,statefulsets -A
    -o jsonpath='{range .items[*]}{.metadata.namespace} {.kind}/{.metadata.name}{"\n"}{end}'
    | grep -v ' DaemonSet/rke2-canal$'
    | while read -r ns obj; do {{ kubectl_bin }} -n "$ns" rollout restart "$obj" || exit 1; done
  args:
    executable: /bin/bash
  changed_when: true

- name: Wait for Rancher to answer
  ansible.builtin.uri:
    url: https://{{ rancher_hostname }}/ping
    validate_certs: false
    return_content: true
  register: etcd_restore_ping
  until: etcd_restore_ping.content | default('') == 'pong'
  retries: 60
  delay: 10
