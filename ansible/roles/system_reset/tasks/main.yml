---
# Destructive: only runs with reset=true (./manage.sh reset). Wipes every local Kubernetes
# distribution and all Docker data on the host.

- name: Kill RKE2 and any orphaned Kubernetes processes
  ansible.builtin.shell: |
    set -o pipefail
    systemctl kill --kill-who=all -s SIGKILL rke2-server 2>/dev/null || true
    systemctl stop rke2-server 2>/dev/null || true
    # Match on the executable path, not the command line (which would match this shell too).
    for exe in /proc/[0-9]*/exe; do
      case "$(readlink "$exe" 2>/dev/null)" in
        *containerd-shim*|*kubelet|*kube-apiserver|*kube-proxy|*kube-scheduler|*kube-controller*|*/etcd)
          pid=${exe#/proc/}; kill -9 "${pid%/exe}" 2>/dev/null || true ;;
      esac
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Run uninstall scripts for RKE2 and K3s
  ansible.builtin.shell: |
    for s in /usr/local/bin/rke2-uninstall.sh /usr/bin/rke2-uninstall.sh /opt/rke2/bin/rke2-uninstall.sh \
             /usr/local/bin/k3s-uninstall.sh /usr/local/bin/k3s-agent-uninstall.sh; do
      [ -x "$s" ] && "$s" || true
    done
  changed_when: true

- name: Delete Kind and K3d clusters
  ansible.builtin.shell: |
    set -o pipefail
    command -v kind >/dev/null && kind get clusters | xargs -r -n1 kind delete cluster --name || true
    command -v k3d >/dev/null && k3d cluster delete --all || true
  args:
    executable: /bin/bash
  changed_when: true

- name: Prune all Docker containers, images, volumes and networks
  ansible.builtin.shell: command -v docker >/dev/null && docker system prune -af --volumes || true
  changed_when: true

- name: Remove stale CNI/KUBE iptables chains
  ansible.builtin.shell: |
    set -o pipefail
    iptables -t nat -D PREROUTING -m addrtype --dst-type LOCAL -j CNI-HOSTPORT-DNAT 2>/dev/null || true
    iptables -t nat -D OUTPUT -m addrtype --dst-type LOCAL -j CNI-HOSTPORT-DNAT 2>/dev/null || true
    iptables -t filter -D FORWARD -j KUBE-FORWARD 2>/dev/null || true
    for table in nat filter; do
      chains=$(iptables -t "$table" -S 2>/dev/null | awk '$1 == "-N" && $2 ~ /^(CNI|KUBE)/ {print $2}')
      for c in $chains; do iptables -t "$table" -F "$c" 2>/dev/null || true; done
      for c in $chains; do iptables -t "$table" -X "$c" 2>/dev/null || true; done
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Unmount leftover Kubernetes mounts
  ansible.builtin.shell: |
    set -o pipefail
    awk '$2 ~ "^(/var/lib/kubelet|/run/k3s)" {print $2}' /proc/mounts | sort -r | xargs -r umount -lf || true
  args:
    executable: /bin/bash
  changed_when: true

- name: Remove leftover Kubernetes data and binaries
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rancher
    - /var/lib/rancher
    - /var/lib/kubelet
    - /var/lib/etcd
    - /run/k3s
    - /run/flannel
    - /etc/cni/net.d
    - /opt/cni/bin
    - "{{ bin_dir }}/kind"
    - "{{ bin_dir }}/k3d"
    - "{{ kubectl_bin }}"
    - "{{ rancher_dev_dir }}"
