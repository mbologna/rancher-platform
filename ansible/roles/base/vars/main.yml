---
base_packages: [curl, git, jq, "{{ 'python3-venv' if ansible_facts.os_family == 'Debian' else 'python3' }}"]

# Longhorn attaches volumes over iSCSI and serves RWX volumes over NFS.
base_longhorn_packages:
  Suse: [open-iscsi, nfs-client]
  Debian: [open-iscsi, nfs-common]
base_longhorn: "{{ 'longhorn' in helm_charts | map(attribute='name', default='') }}"

base_docker_package:
  Suse: [docker]
  Debian: [docker.io]

base_sysctl:
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 1024
  vm.max_map_count: 262144
  net.core.somaxconn: 65535
  net.ipv4.ip_local_port_range: 1024 65000
