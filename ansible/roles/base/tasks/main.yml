---
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Stop and disable the host firewall (RKE2 manages its own rules)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [firewalld.service, ufw.service]
  when: ansible_facts.services[item].status | default('not-found') != 'not-found'

- name: Read SELinux mode
  ansible.builtin.command: getenforce
  register: base_selinux
  changed_when: false
  failed_when: false
  when: selinux_mode | length > 0

- name: Set SELinux mode
  when:
    - selinux_mode | length > 0
    - base_selinux.rc == 0
    - base_selinux.stdout | lower not in ['disabled', selinux_mode]
  block:
    - name: Set SELinux mode now
      ansible.builtin.command: setenforce {{ '0' if selinux_mode == 'permissive' else '1' }}
      changed_when: true

    - name: Persist SELinux mode
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: ^SELINUX=
        line: SELINUX={{ selinux_mode }}

- name: Refresh the apt cache (fresh cloud images ship without one)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages + (base_docker_package[ansible_facts.os_family] if install_docker | bool else []) }}"
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: install_docker | bool

# CAPD attaches load balancer and node containers to the "kind" network. Docker 28+ drops
# routed traffic to container IPs, which blocks the CAPI controllers in the pod network;
# nat-unprotected lifts that. An unused network without the option is recreated.
- name: Create the Docker network for CAPD
  ansible.builtin.shell: |
    {% raw %}
    opt=com.docker.network.bridge.gateway_mode_ipv4
    if mode=$(docker network inspect kind -f "{{index .Options \"$opt\"}}" 2>/dev/null); then
      [ "$mode" = nat-unprotected ] && exit 0
      [ -n "$(docker network inspect kind -f '{{range .Containers}}x{{end}}')" ] && exit 0
      docker network rm kind >/dev/null
    fi
    docker network create -o "$opt=nat-unprotected" kind >/dev/null
    echo changed
    {% endraw %}
  args:
    executable: /bin/bash
  register: base_kind_network
  changed_when: "'changed' in base_kind_network.stdout"
  when: capd_enabled | bool

- name: Create a Python virtualenv for the Kubernetes modules
  ansible.builtin.pip:
    name: [kubernetes, PyYAML]
    virtualenv: "{{ k8s_venv }}"
    virtualenv_command: "{{ ansible_facts.python.executable }} -m venv"

- name: Create the dev directory
  ansible.builtin.file:
    path: "{{ rancher_dev_dir }}"
    state: directory
    mode: "0700"

- name: Resolve the Rancher hostname locally (avoids hairpin NAT on AWS)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: \s{{ rancher_hostname | regex_escape }}$
    line: "{{ ansible_facts.default_ipv4.address }} {{ rancher_hostname }}"

- name: Tune kernel parameters for containers
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-rancher-platform.conf
  loop: "{{ base_sysctl | dict2items }}"

- name: Remove helper scripts from older versions of this playbook
  ansible.builtin.file:
    path: "{{ bin_dir }}/{{ item }}"
    state: absent
  loop: [cleanup-rancher, cluster-status, rancher-logs, port-forward-rancher, uninstall-rancher]
