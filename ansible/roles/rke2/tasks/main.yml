---
# Lists every RKE2/K3s binary in a standard location, ours first, as "<path> <version line>".
- name: Check installed RKE2 version
  ansible.builtin.shell: |
    set -o pipefail
    for p in {{ rke2_install_prefix }}/bin/rke2 /usr/local/bin/rke2 /opt/rke2/bin/rke2 /usr/bin/rke2 \
             /usr/local/bin/k3s /usr/bin/k3s; do
      [ -x "$p" ] && echo "$p $("$p" --version 2>/dev/null | head -1)"
    done | awk '!seen[$1]++'
  args:
    executable: /bin/bash
  register: rke2_found
  changed_when: false
  failed_when: false

# A second install under another prefix keeps its own systemd unit, so an upgrade would not take effect.
- name: Refuse to deploy over RKE2 or K3s installed by other means
  ansible.builtin.assert:
    that: rke2_foreign | length == 0
    fail_msg: >-
      Found {{ rke2_foreign | join(', ') }} outside {{ rke2_install_prefix }}.
      Run `./manage.sh reset` to remove it and deploy from scratch.
    quiet: true
  vars:
    rke2_foreign: >-
      {{ rke2_found.stdout_lines | map('split') | map('first')
         | reject('equalto', rke2_install_prefix ~ '/bin/rke2') | list }}

- name: Record the installed RKE2 version
  ansible.builtin.set_fact:
    rke2_installed: "{{ rke2_found.stdout_lines | first | default('') }}"

- name: List listeners on the ports RKE2 needs
  ansible.builtin.command: >-
    ss -ltnpH '( sport = :80 or sport = :443 or sport = :6443 or sport = :9345 or sport = :10250 )'
  register: rke2_port_users
  changed_when: false
  when: rke2_installed | length == 0

- name: Refuse to install RKE2 while other services hold its ports
  ansible.builtin.assert:
    that: rke2_port_users.stdout_lines | length == 0
    fail_msg: >-
      Ports needed by RKE2 are in use (for example by kind or Docker port mappings):
      {{ rke2_port_users.stdout_lines | map('split') | map('join', ' ') | join('; ') }}.
      Stop those services, or run `./manage.sh reset` to remove kind/k3d/K3s and all Docker data.
    quiet: true
  when: rke2_installed | length == 0

# Kubernetes upgrades one minor version at a time and does not support downgrades.
- name: Refuse to skip or roll back a Kubernetes minor version
  ansible.builtin.assert:
    that: (rke2_target_minor | int) - (rke2_installed_minor | int) in [0, 1]
    fail_msg: >-
      RKE2 is at 1.{{ rke2_installed_minor }}; {{ rke2_version }} would move to 1.{{ rke2_target_minor }}.
      Kubernetes cannot downgrade or skip a minor; upgrade through each minor with -e rke2_version=<v1.N.x release>,
      or run `./manage.sh reset` to wipe the cluster and deploy from scratch.
    quiet: true
  vars:
    rke2_installed_minor: "{{ rke2_installed | regex_search('v1\\.(\\d+)\\.', '\\1') | first | int }}"
    rke2_target_minor: "{{ rke2_version | regex_search('v1\\.(\\d+)\\.', '\\1') | first | int }}"
  when: rke2_installed | length > 0

- name: Install RKE2 {{ rke2_version }}
  when: rke2_version not in rke2_installed
  block:
    - name: Download the RKE2 install script
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: /usr/local/share/rke2-install.sh
        mode: "0755"
        force: true

    - name: Run the RKE2 install script
      ansible.builtin.command: /usr/local/share/rke2-install.sh
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TAR_PREFIX: "{{ rke2_install_prefix }}"
      changed_when: true
      notify: Restart rke2

- name: Create the RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Write RKE2 server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  no_log: "{{ rke2_etcd_s3_secret_key is defined }}"
  notify: Restart rke2

- name: Point RKE2 at the registry cache
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/rke2/registries.yaml
    mode: "0600"
  when: registry_cache_mirrors | length > 0
  notify: Restart rke2

- name: Check for a registries.yaml written by rancher-platform
  ansible.builtin.command: grep -q '^# Written by rancher-platform' /etc/rancher/rke2/registries.yaml
  register: rke2_registries_ours
  changed_when: false
  failed_when: false
  when: registry_cache_mirrors | length == 0

- name: Remove the registry cache from RKE2
  ansible.builtin.file:
    path: /etc/rancher/rke2/registries.yaml
    state: absent
  when: registry_cache_mirrors | length == 0 and rke2_registries_ours.rc == 0
  notify: Restart rke2

- name: Apply pending RKE2 (re)starts (first start can take several minutes)
  ansible.builtin.meta: flush_handlers

- name: Enable and start RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started

- name: Link the bundled kubectl into PATH
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: "{{ kubectl_bin }}"
    state: link
    force: true

- name: Wait for the node to become Ready
  ansible.builtin.command: "{{ kubectl_bin }} wait --for=condition=Ready node --all --timeout=30s"
  register: rke2_node_ready
  until: rke2_node_ready.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Read the RKE2 kubeconfig
  ansible.builtin.slurp:
    src: "{{ rke2_kubeconfig }}"
  register: rke2_kubeconfig_content

- name: Write an external kubeconfig pointing at the public hostname
  ansible.builtin.copy:
    content: >-
      {{ rke2_kubeconfig_content.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ rancher_hostname ~ ':6443') }}
    dest: "{{ rke2_kubeconfig_external }}"
    mode: "0600"

- name: Look up the SSH user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user | default('root') }}"

- name: Install kubeconfig for the SSH user
  vars:
    rke2_user: "{{ ansible_user | default('root') }}"
    rke2_user_home: "{{ ansible_facts.getent_passwd[rke2_user][4] }}"
  block:
    - name: Create the SSH user's ~/.kube
      ansible.builtin.file:
        path: "{{ rke2_user_home }}/.kube"
        state: directory
        owner: "{{ rke2_user }}"
        mode: "0700"

    - name: Copy the kubeconfig to the SSH user's ~/.kube/config
      ansible.builtin.copy:
        src: "{{ rke2_kubeconfig }}"
        dest: "{{ rke2_user_home }}/.kube/config"
        remote_src: true
        owner: "{{ rke2_user }}"
        mode: "0600"
