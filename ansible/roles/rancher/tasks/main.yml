---
- name: Wait for the RKE2 ingress controller to roll out
  ansible.builtin.command: >-
    {{ kubectl_bin }} -n kube-system rollout status daemonset/rke2-traefik --timeout=30s
  register: rancher_ingress_ready
  until: rancher_ingress_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Read the installed Rancher release
  kubernetes.core.helm_info:
    name: rancher
    release_namespace: cattle-system
    binary_path: "{{ helm_bin }}"
  register: rancher_release

- name: Read the running Rancher image
  ansible.builtin.command: >-
    {{ kubectl_bin }} -n cattle-system get deployment rancher --ignore-not-found
    -o jsonpath={.spec.template.spec.containers[0].image}
  register: rancher_installed_image
  changed_when: false

- name: Note the installed Rancher build
  ansible.builtin.set_fact:
    rancher_installed_version: "{{ rancher_release.status.chart | default('') | regex_replace('^rancher-', '') }}"

- name: Refuse to downgrade Rancher
  ansible.builtin.assert:
    that: >-
      rancher_installed_version == ''
      or rancher_version is version(rancher_installed_version, '>=', version_type='semver')
    fail_msg: >-
      Rancher {{ rancher_installed_version }} is installed and cannot be downgraded to {{ rancher_version }}.
      Restore a snapshot taken before the upgrade instead (./manage.sh snapshots, ./manage.sh restore <name>).
    quiet: true

- name: Snapshot etcd before changing the Rancher build
  ansible.builtin.command: >-
    {{ rke2_bin }} etcd-snapshot save --name
    {{ ('pre-upgrade-' ~ rancher_installed_image.stdout.split(':') | last ~ '-to-' ~ rancher_target) | lower
       | regex_replace('[^a-z0-9.-]', '-') | truncate(50, true, '') }}
  changed_when: true
  when:
    - rancher_installed_image.stdout | length > 0
    - rancher_installed_image.stdout != rancher_image_repo ~ ':' ~ rancher_target

- name: Install or upgrade Rancher to {{ rancher_target }}
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher
    chart_repo_url: "{{ rancher_chart_repo }}"
    chart_version: "{{ rancher_version }}"
    release_namespace: cattle-system
    create_namespace: true
    binary_path: "{{ helm_bin }}"
    values: "{{ rancher_values }}"
    wait: true
    timeout: 600s

- name: Wait for the Rancher API to answer through the ingress
  ansible.builtin.uri:
    url: https://{{ rancher_hostname }}/ping
    validate_certs: false
  register: rancher_ping
  until: rancher_ping.status | default(0) == 200
  retries: 30
  delay: 10

# Rancher fills server-url at the first UI login; until then it cannot import clusters.
- name: Read the Rancher server URL
  kubernetes.core.k8s_info:
    api_version: management.cattle.io/v3
    kind: Setting
    name: server-url
  register: rancher_server_url
  until: rancher_server_url.resources | default([]) | length > 0
  retries: 20
  delay: 15

# Agents and registration manifests use server-url, so it follows rancher_hostname.
- name: Set the Rancher server URL to https://{{ rancher_hostname }}
  kubernetes.core.k8s:
    api_version: management.cattle.io/v3
    kind: Setting
    name: server-url
    state: patched
    definition:
      value: https://{{ rancher_hostname }}
  when: rancher_server_url.resources[0].value | default('') != 'https://' ~ rancher_hostname

- name: Apply Rancher settings
  kubernetes.core.k8s:
    definition:
      apiVersion: management.cattle.io/v3
      kind: Setting
      metadata:
        name: "{{ item.key }}"
      value: "{{ item.value | string }}"
  loop: "{{ rancher_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# A moving tag (head) keeps its name while the image changes; restart Rancher when the registry has a
# newer digest than the running pod, or always for registries other than Docker Hub.
- name: Pull a newer image for tag {{ rancher_image_tag }}
  ansible.builtin.include_tasks: refresh.yml
  when: rancher_image_moving

# Both TLS sources use an Issuer named "rancher", so switching source keeps the old certificate.
# Compare the signing CA with the configured source and re-issue on mismatch.
- name: Read the CA that signed the ingress certificate
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ kubectl_bin }} -n cattle-system get secret tls-rancher-ingress -o jsonpath='{.data.tls\.crt}'
    | base64 -d | openssl x509 -noout -issuer
  args:
    executable: /bin/bash
  register: rancher_cert_issuer
  until: rancher_cert_issuer.rc == 0
  retries: 20
  delay: 15
  changed_when: false

- name: Re-issue the ingress certificate from the configured source
  ansible.builtin.command: "{{ kubectl_bin }} -n cattle-system delete secret tls-rancher-ingress"
  when: rancher_tls_issuer_cn[rancher_tls_source] not in rancher_cert_issuer.stdout
  changed_when: true

- name: Wait for the certificate from the configured source
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ kubectl_bin }} -n cattle-system get secret tls-rancher-ingress -o jsonpath='{.data.tls\.crt}'
    | base64 -d | openssl x509 -noout -issuer
  args:
    executable: /bin/bash
  register: rancher_cert_reissued
  until: rancher_cert_reissued.rc == 0 and rancher_tls_issuer_cn[rancher_tls_source] in rancher_cert_reissued.stdout
  retries: 20
  delay: 15
  changed_when: false
  when: rancher_tls_issuer_cn[rancher_tls_source] not in rancher_cert_issuer.stdout

# Rancher v2.14+ deploys Turtles as a system chart and manages the CAPI CoreProvider itself.
# CAPI providers are installed by rancher-fleet-clusters.
- name: Wait for the Turtles controller to become available
  kubernetes.core.k8s_info:
    kind: Deployment
    name: rancher-turtles-controller-manager
    namespace: cattle-turtles-system
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 60
  register: rancher_turtles
  until: rancher_turtles.resources | default([]) | length > 0 # transient API errors return no resources
  retries: 20
  delay: 15
