---
- name: Look up the Rancher cluster {{ downstream_clusters_name }}
  kubernetes.core.k8s_info:
    api_version: provisioning.cattle.io/v1
    kind: Cluster
    namespace: fleet-default
    name: "{{ downstream_clusters_name }}"
  register: downstream_clusters_existing

# Rancher cannot turn an imported cluster into a provisioned one or back.
- name: Refuse to change the type of {{ downstream_clusters_name }}
  ansible.builtin.assert:
    that: >-
      not downstream_clusters_existing.resources
      or (downstream_clusters_existing.resources[0].spec.rkeConfig | default(none) is not none)
         == (downstream_clusters_spec.type == 'rke2')
    fail_msg: >-
      {{ downstream_clusters_name }} exists in Rancher with another type. Remove it from downstream_clusters,
      deploy to delete it, then add it back with the new type.
    quiet: true

- name: Create the kind cluster {{ downstream_clusters_name }}
  ansible.builtin.include_tasks: kind.yml
  when: downstream_clusters_spec.type == 'kind'

# The annotation records the label keys this role set, so keys dropped from the entry can be removed
# (a null value deletes a label in a merge patch).
- name: Find labels removed from {{ downstream_clusters_name }}
  ansible.builtin.set_fact:
    downstream_clusters_labels: >-
      {{ dict(downstream_clusters_stale | zip_longest([], fillvalue=none))
         | combine(downstream_clusters_spec.labels | default({})) }}
  vars:
    downstream_clusters_stale: >-
      {{ (downstream_clusters_existing.resources[0].metadata.annotations[downstream_clusters_labels_annotation]
          | default('') if downstream_clusters_existing.resources else '').split(',') | select
         | difference(downstream_clusters_spec.labels | default({}) | list) }}

# The RKE2 admin is not a Rancher user, so a new cluster gets no creator. Rancher's webhook rejects this
# annotation on a cluster that already has one.
- name: Register the Rancher cluster {{ downstream_clusters_name }}
  kubernetes.core.k8s:
    definition:
      apiVersion: provisioning.cattle.io/v1
      kind: Cluster
      metadata:
        name: "{{ downstream_clusters_name }}"
        namespace: fleet-default
        labels: "{{ downstream_clusters_labels | combine({downstream_clusters_label: 'true'}) }}"
        annotations: >-
          {{ {downstream_clusters_labels_annotation: downstream_clusters_spec.labels | default({}) | join(',')}
             | combine({} if downstream_clusters_existing.resources else {'field.cattle.io/no-creator-rbac': 'true'}) }}
      spec: "{{ downstream_clusters_rke2_spec if downstream_clusters_spec.type == 'rke2' else {} }}"

- name: Wait for the registration manifest of {{ downstream_clusters_name }}
  kubernetes.core.k8s_info:
    api_version: provisioning.cattle.io/v1
    kind: Cluster
    namespace: fleet-default
    name: "{{ downstream_clusters_name }}"
  register: downstream_clusters_cluster
  until: downstream_clusters_cluster.resources[0].status.clusterName | default('') | length > 0
  retries: 30
  delay: 5

- name: Note the Rancher ID of {{ downstream_clusters_name }}
  ansible.builtin.set_fact:
    downstream_clusters_id: "{{ downstream_clusters_cluster.resources[0].status.clusterName }}"

# Rancher copies provisioning labels to the management cluster only on creation, and Fleet reads them
# from the management cluster.
- name: Set the Fleet labels of {{ downstream_clusters_name }}
  kubernetes.core.k8s:
    api_version: management.cattle.io/v3
    kind: Cluster
    name: "{{ downstream_clusters_id }}"
    state: patched
    definition:
      metadata:
        labels: "{{ downstream_clusters_labels }}"
  when: downstream_clusters_labels | length > 0

- name: Import the kind cluster {{ downstream_clusters_name }}
  ansible.builtin.include_tasks: kind_import.yml
  when: downstream_clusters_spec.type == 'kind'

- name: Run the rke2 nodes of {{ downstream_clusters_name }}
  ansible.builtin.include_tasks: rke2_nodes.yml
  when: downstream_clusters_spec.type == 'rke2'

- name: Wait for Rancher to report ready on {{ downstream_clusters_name }}
  kubernetes.core.k8s_info:
    api_version: provisioning.cattle.io/v1
    kind: Cluster
    namespace: fleet-default
    name: "{{ downstream_clusters_name }}"
  register: downstream_clusters_ready
  until: downstream_clusters_ready.resources[0].status.ready | default(false)
  retries: 90
  delay: 10
