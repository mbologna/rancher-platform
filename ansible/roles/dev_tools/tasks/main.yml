---
- name: Install helper scripts
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "{{ bin_dir }}/{{ item }}"
    mode: "0755"
  loop: "{{ dev_tools_scripts }}"

- name: Remove helper scripts from older versions of this playbook
  ansible.builtin.file:
    path: "{{ bin_dir }}/cleanup-rancher"
    state: absent
