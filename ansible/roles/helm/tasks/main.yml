---
- name: Check installed Helm version
  ansible.builtin.command: "{{ helm_bin }} version --short"
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Install Helm {{ helm_version }}
  when: helm_installed.stdout.split('+')[0] != helm_version
  block:
    - name: Download Helm
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        checksum: "sha256:{{ helm_url }}.sha256sum"
        dest: /tmp/helm-{{ helm_version }}.tar.gz
        mode: "0644"

    - name: Unpack Helm
      ansible.builtin.unarchive:
        src: /tmp/helm-{{ helm_version }}.tar.gz
        dest: /tmp
        remote_src: true
        include: ["linux-{{ helm_arch }}/helm"]

    - name: Install the Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-{{ helm_arch }}/helm
        dest: "{{ helm_bin }}"
        remote_src: true
        mode: "0755"

- name: List Helm plugins
  ansible.builtin.command: "{{ helm_bin }} plugin list"
  register: helm_plugins
  changed_when: false

- name: Remove outdated helm-diff
  ansible.builtin.command: "{{ helm_bin }} plugin uninstall diff"
  changed_when: true
  when:
    - helm_plugins.stdout is search('^diff\\s', multiline=True)
    - not (helm_diff_current | bool)

# helm-diff lets kubernetes.core.helm skip no-op upgrades
- name: Install helm-diff {{ helm_diff_version }}
  when: not (helm_diff_current | bool)
  block:
    - name: Download helm-diff
      ansible.builtin.get_url:
        url: "{{ helm_diff_url }}/{{ helm_diff_tarball }}"
        checksum: "sha256:{{ helm_diff_url }}/helm-diff_{{ helm_diff_version | regex_replace('^v', '') }}_checksums.txt"
        dest: /tmp/{{ helm_diff_tarball }}
        mode: "0644"

    # Helm 4 verifies plugin signatures against a GPG keyring; get_url checked the tarball instead.
    # Helm names the plugin after the tarball, so it keeps its release name.
    - name: Install the helm-diff plugin
      ansible.builtin.command: "{{ helm_bin }} plugin install /tmp/{{ helm_diff_tarball }} --verify=false"
      changed_when: true
