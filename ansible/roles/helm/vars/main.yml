---
helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
helm_url: https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz
helm_diff_url: https://github.com/databus23/helm-diff/releases/download/{{ helm_diff_version }}
helm_diff_tarball: diff-{{ helm_diff_version | regex_replace('^v', '') }}-linux-{{ helm_arch }}.tgz
helm_diff_current: >-
  {{ helm_plugins.stdout is search('^diff\s+' ~ helm_diff_version | regex_replace('^v', '') ~ '\s', multiline=True) }}
