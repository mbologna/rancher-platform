---
# Fleet GitRepos for fleet_apps. Each app gets one GitRepo per workspace (by default fleet-local and
# fleet-default), because a GitRepo only targets clusters in its own workspace. GitRepos this role
# creates carry fleet_apps_label; prune touches nothing else.
- name: Check the Fleet apps
  ansible.builtin.assert:
    that:
      - fleet_apps is sequence and fleet_apps is not string
      - fleet_apps | reject('mapping') | list | length == 0
      - fleet_apps_names | reject('match', '^[a-z0-9]([-a-z0-9]{0,51}[a-z0-9])?$') | list | length == 0
      - fleet_apps_names | unique | length == fleet_apps_names | length
      - fleet_apps | map(attribute='repo', default='') | reject | list | length == 0
      - fleet_apps | map(attribute='paths', default='') | reject | list | length == 0
      - fleet_apps_specs | map(attribute='workspaces') | flatten | difference(fleet_apps_workspaces) | length == 0
      - fleet_apps_ingresses | map(attribute='ingress.service', default='') | reject | list | length == 0
      - fleet_apps_ingresses | map(attribute='ingress.port', default='') | reject | list | length == 0
    fail_msg: >-
      fleet_apps must be a list of {name, repo, paths, branch, workspaces, targets, keep_resources, ingress} with
      unique lowercase DNS-label names, workspaces from {{ fleet_apps_workspaces }} and ingress as
      {service, port, namespace}; got {{ fleet_apps }}.

# The GitRepo CRD appears once Rancher has deployed Fleet.
- name: Register the Fleet apps
  kubernetes.core.k8s:
    definition:
      apiVersion: fleet.cattle.io/v1alpha1
      kind: GitRepo
      metadata:
        name: "{{ item[0].name }}"
        namespace: "{{ item[1] }}"
        labels: "{{ {fleet_apps_label: 'true'} }}"
      spec: >-
        {{ {'repo': item[0].repo, 'paths': item[0].paths, 'targets': item[0].targets}
           | combine({'branch': item[0].branch} if item[0].branch is defined else {})
           | combine({'keepResources': true} if item[0].keep_resources | bool else {}) }}
  loop: "{{ fleet_apps_pairs }}"
  loop_control:
    label: "{{ item[1] }}/{{ item[0].name }}"
  register: fleet_apps_registered
  until: fleet_apps_registered is succeeded
  retries: 20
  delay: 15

- name: Wait for Fleet to deploy the apps
  kubernetes.core.k8s_info:
    api_version: fleet.cattle.io/v1alpha1
    kind: GitRepo
    name: "{{ item[0].name }}"
    namespace: "{{ item[1] }}"
  loop: "{{ fleet_apps_pairs }}"
  loop_control:
    label: "{{ item[1] }}/{{ item[0].name }}"
  register: fleet_apps_status
  until: >-
    fleet_apps_status.resources | map(attribute='status.conditions', default=[]) | flatten
    | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 10

- name: Find Fleet apps that are no longer listed
  kubernetes.core.k8s_info:
    api_version: fleet.cattle.io/v1alpha1
    kind: GitRepo
    namespace: "{{ item }}"
    label_selectors: ["{{ fleet_apps_label }}=true"]
  loop: "{{ fleet_apps_workspaces }}"
  register: fleet_apps_existing
  failed_when: false

# Fleet removes an app's resources from every cluster when its GitRepo goes.
- name: Remove unlisted Fleet apps
  kubernetes.core.k8s:
    api_version: fleet.cattle.io/v1alpha1
    kind: GitRepo
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
  loop: "{{ fleet_apps_existing.results | map(attribute='resources', default=[]) | flatten }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when: item.metadata.namespace ~ '/' ~ item.metadata.name not in fleet_apps_wanted

# Ingresses on the Rancher cluster; the namespace exists once Fleet has deployed the app there.
- name: Expose the Fleet apps on the Rancher cluster
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.ingress.namespace | default('default') }}"
        labels: "{{ {fleet_apps_label: 'true'} }}"
      spec:
        ingressClassName: traefik
        rules:
          - host: "{{ item.name }}.{{ fleet_apps_ingress_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ item.ingress.service }}"
                      port:
                        number: "{{ item.ingress.port | int }}"
  loop: "{{ fleet_apps_ingresses }}"
  loop_control:
    label: "{{ item.name }}.{{ fleet_apps_ingress_domain }}"

- name: Find app Ingresses that are no longer listed
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    label_selectors: ["{{ fleet_apps_label }}=true"]
  register: fleet_apps_ingresses_existing

- name: Remove unlisted app Ingresses
  kubernetes.core.k8s:
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
  loop: "{{ fleet_apps_ingresses_existing.resources }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when: item.metadata.namespace ~ '/' ~ item.metadata.name not in fleet_apps_ingresses_wanted
