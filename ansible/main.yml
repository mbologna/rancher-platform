---
- name: Bootstrap Python on target hosts
  hosts: servers
  gather_facts: false
  become: true
  tags: [always]
  tasks:
    # ansible-core needs Python >= 3.8 on the target. SLE/Leap 15 ship 3.6, so install 3.11 there.
    - name: Check for a usable python3
      ansible.builtin.raw: python3 -c 'import sys; sys.exit(sys.version_info < (3, 8))'
      register: python3_ok
      changed_when: false
      failed_when: false

    - name: Check for python3.11
      ansible.builtin.raw: test -x /usr/bin/python3.11
      register: python311_ok
      changed_when: false
      failed_when: false
      when: python3_ok.rc != 0

    - name: Install Python 3.11 on SLE/Leap 15
      when: python3_ok.rc != 0 and python311_ok.rc != 0
      block:
        - name: Enable the SLE Python 3 module (SLES only; no-op elsewhere)
          ansible.builtin.raw: >-
            . /etc/os-release;
            if [ "$ID" = sles ]; then suseconnect -p "sle-module-python3/${VERSION_ID}/$(uname -m)"; fi
          changed_when: true

        - name: Install python311
          ansible.builtin.raw: zypper --non-interactive install python311
          changed_when: true

    # Kept out of ansible_python_interpreter: a set_fact there would outrank the per-role venv below.
    - name: Record the system Python for the deploy play
      ansible.builtin.set_fact:
        base_python: >-
          {{ ansible_python_interpreter if ansible_python_interpreter is defined
             else '/usr/bin/python3' if python3_ok.rc == 0 else '/usr/bin/python3.11' }}

    - name: Gather facts
      ansible.builtin.setup:
      vars:
        ansible_python_interpreter: "{{ base_python }}"

    - name: Validate required settings
      ansible.builtin.assert:
        that:
          - rancher_bootstrap_password is defined
          - rancher_bootstrap_password != 'CHANGE_ME'
          - rancher_bootstrap_password | length >= 12
          - rancher_tls_source in ['rancher', 'letsEncrypt']
          - rancher_tls_source != 'letsEncrypt' or rancher_letsencrypt_email | length > 0
        fail_msg: >-
          Set rancher_bootstrap_password (12+ characters) in
          group_vars/all/secrets.yml (copy secrets.yml.example). rancher_tls_source must be rancher or
          letsEncrypt; letsEncrypt also needs rancher_letsencrypt_email.
        quiet: true

- name: Deploy RKE2 + Rancher Manager
  hosts: servers
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: "{{ base_python }}"
  environment:
    PATH: "{{ bin_dir }}:/usr/sbin:/usr/bin:/sbin:/bin"
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ rke2_kubeconfig }}"

  roles:
    - role: system_reset
      when: reset | bool
      tags: [reset]
    - role: base
      tags: [base]
    - role: helm
      tags: [helm]
    - role: registry_cache
      tags: [registry_cache]
    - role: rke2
      tags: [rke2]
    - role: cert_manager
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [cert_manager]
    - role: rancher
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [rancher]
    - role: rancher_ai
      when: rancher_ai_enabled | bool
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [rancher_ai]
    - role: downstream_clusters
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [downstream]
    - role: fleet_apps
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [fleet]
    - role: helm_charts
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [helm_charts]
    - role: capi_providers
      when: capi_providers_enabled | bool
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [capi_providers]

  post_tasks:
    # Run only with their tags: ./manage.sh snapshot, snapshots and restore.
    - name: Save an etcd snapshot
      ansible.builtin.include_tasks:
        file: tasks/etcd_snapshot.yml
        apply:
          tags: [snapshot]
      tags: [never, snapshot]

    - name: List etcd snapshots
      ansible.builtin.include_tasks:
        file: tasks/etcd_snapshots.yml
        apply:
          tags: [snapshots]
      tags: [never, snapshots]

    - name: Restore an etcd snapshot
      ansible.builtin.include_tasks:
        file: tasks/etcd_restore.yml
        apply:
          tags: [restore]
      tags: [never, restore]

    # Runs only with --tags uninstall (./manage.sh uninstall-rancher).
    - name: Remove Rancher, Rancher AI and cert-manager (RKE2 and the downstream clusters stay)
      ansible.builtin.script: files/uninstall-rancher.sh
      changed_when: true
      tags: [never, uninstall]

    - name: Write the local kubeconfig
      ansible.builtin.include_tasks:
        file: tasks/kubeconfig.yml
        apply:
          tags: [kubeconfig]
      tags: [always]

    - name: Show summary
      ansible.builtin.include_tasks:
        file: tasks/summary.yml
        apply:
          tags: [always]
      tags: [always]
