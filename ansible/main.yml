---
- name: Bootstrap Python on target hosts
  hosts: servers
  gather_facts: false
  become: true
  tasks:
    # ansible-core needs Python >= 3.8 on the target. SLE/Leap 15 ship 3.6, so install 3.11 there.
    - name: Check for a usable python3
      ansible.builtin.raw: python3 -c 'import sys; sys.exit(sys.version_info < (3, 8))'
      register: python3_ok
      changed_when: false
      failed_when: false

    - name: Install Python 3.11 on SLE/Leap 15
      when: python3_ok.rc != 0
      block:
        - name: Enable the SLE Python 3 module (SLES only; no-op elsewhere)
          ansible.builtin.raw: >-
            . /etc/os-release;
            if [ "$ID" = sles ]; then suseconnect -p "sle-module-python3/${VERSION_ID}/$(uname -m)"; fi
          changed_when: true

        - name: Install python311
          ansible.builtin.raw: zypper --non-interactive install python311
          changed_when: true

        - name: Use Python 3.11 for the rest of the run
          ansible.builtin.set_fact:
            ansible_python_interpreter: /usr/bin/python3.11

    - name: Gather facts
      ansible.builtin.setup:

    - name: Validate required settings
      ansible.builtin.assert:
        that:
          - rancher_hostname is defined
          - rancher_bootstrap_password is defined
          - rancher_bootstrap_password != 'CHANGE_ME'
          - rancher_bootstrap_password | length >= 12
        fail_msg: >-
          Set rancher_hostname in the inventory and rancher_bootstrap_password (12+ characters) in
          group_vars/all/secrets.yml (copy secrets.yml.example).
        quiet: true

- name: Deploy RKE2 + Rancher Manager
  hosts: servers
  gather_facts: false
  become: true
  environment:
    PATH: "{{ bin_dir }}:/usr/sbin:/usr/bin:/sbin:/bin"
    KUBECONFIG: "{{ rke2_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ rke2_kubeconfig }}"

  roles:
    - role: system_reset
      when: reset | bool
      tags: [reset]
    - role: base
      tags: [base]
    - role: helm
      tags: [helm]
    - role: rke2
      tags: [rke2]
    - role: cert_manager
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [cert_manager]
    - role: rancher
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [rancher]
    - role: fleet_gitrepo
      when: fleet_gitrepo_enabled | bool
      vars:
        ansible_python_interpreter: "{{ k8s_python }}"
      tags: [fleet]
    - role: dev_tools
      tags: [dev_tools]

  post_tasks:
    - name: Show summary
      ansible.builtin.include_tasks: tasks/summary.yml
      tags: [always]
